
<!DOCTYPE html>
<html>
<head>
    <title>Canvas Test</title>
</head>
<body>

    <canvas id="graphics" width="300" height="100"
            style="border: 1px solid black;"></canvas>

    <script>
        var a = document.getElementById("graphics");
        var design = a.getContext("2d");

        design.font = "20px Arial";
        design.strokeStyle = "pink";
        design.strokeText("graphics", 10, 50);
    </script>
    

</body>
</html>
