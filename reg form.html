<!DOCTYPE html>
<html>
    <head>
        <title>Registration form</title>
    </head>
 <body style="text-align:center;background-color:rgb(227, 209, 209)">
    <h1 style="text-align:center">Registration form</h1>
   
    <form>
        <label style=font-size:20px; for="name">Name:</label>
        <input type="text" id="name" required>
        <br><br>
        <label style=font-size:20px; for="mail">mail:</label>
        <input type="mail" id="mail" required>
        <br><br>
        <label style=font-size:20px; for="phone">Phone:</label>
        <input type="tel"
               id="phone"
               pattern="[0-9]{10}"
               required>
        <br><br>
        <label style=font-size:20px; for="age">Age:</label>
        <input type="number"
               id="number"
               min="18"
               max="60"
               required>
        <br><br>
        <label style="font-size:20px"; for="password">Password:</label>    
        <input type="Password"   
               id="password"
               minlength="8"
               required>
        <br><br>
        <button style="font-size:20px"; type ="Submit">Submit</button>
        <br><br>
        
    </form>
 </body>   
</html>
